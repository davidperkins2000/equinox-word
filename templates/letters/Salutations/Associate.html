<!-- Salutation block for a letter to a foreign associate: their reference, ours, our client's, "Dear …" and the subject, with the matter's picture floated at the right of the subject (#THUMBNAIL|right 80#: side, then width in points). Used when the letter goes to an associate. -->
<p class="letter-reference">Your ref: #EQX_YOURREF#<br>Our ref: #MATTER#<br>Our client: #CLIENT#</p>
<p class="letter-salutation">Dear #SALUTATION#</p>
<p class="letter-subject">#THUMBNAIL|right 80##COUNTRY# #CATEGORY# No. #GRANTED?APPLICATION#<br>#TITLE#<br>In the name of #APPLICANT#</p>
