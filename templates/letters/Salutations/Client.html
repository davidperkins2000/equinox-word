<!-- Salutation block for a letter to the client: references, "Dear …" and the subject, with the matter's picture floated at the right of the subject (#THUMBNAIL|right 80#: side, then width in points). Used when the letter goes to the client. -->
<p class="letter-reference">Your ref: #EQX_YOURREF#<br>Our ref: #MATTER#</p>
<p class="letter-salutation">Dear #SALUTATION#</p>
<p class="letter-subject">#THUMBNAIL|right 80##COUNTRY# #CATEGORY# No. #GRANTED?APPLICATION#<br>#TITLE#<br>In the name of #APPLICANT#</p>
